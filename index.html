/* ========== Product catalog ========== */

/* ========== Helpers ========== */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness: opts.roughness ?? 0.55,
    metalness: opts.metalness ?? 0.05,
    transparent: !!opts.transparent,
    opacity: opts.opacity ?? 1,
    side: opts.side ?? THREE.FrontSide,
    flatShading: false,
  });
}

function addGlitter(group, count, radius, colors) {
  const geo = new THREE.SphereGeometry(0.025, 6, 6);
  for (let i = 0; i < count; i++) {
    const c = colors[i % colors.length];
    const m = new THREE.Mesh(geo, mat(c, { roughness: 0.2, metalness: 0.6 }));
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    const r = radius * (0.25 + Math.random() * 0.65);
    m.position.set(
      r * Math.sin(ph) * Math.cos(th),
      r * Math.sin(ph) * Math.sin(th),
      r * Math.cos(ph)
    );
    m.scale.setScalar(0.5 + Math.random());
    group.add(m);
  }
}

function faceDots(group, y, z, spread, color = 0x2a1a20) {
  const eyeGeo = new THREE.SphereGeometry(0.06, 10, 10);
  const eyeMat = mat(color, { roughness: 0.4 });
  const le = new THREE.Mesh(eyeGeo, eyeMat);
  le.position.set(-spread, y, z);
  const re = new THREE.Mesh(eyeGeo, eyeMat);
  re.position.set(spread, y, z);
  group.add(le, re);
  const nose = new THREE.Mesh(
    new THREE.SphereGeometry(0.04, 8, 8),
    mat(0xff8fab, { roughness: 0.5 })
  );
  nose.position.set(0, y - 0.1, z + 0.02);
  group.add(nose);
}

function markDeformable(mesh) {
  if (!mesh || !mesh.geometry) return mesh;
  const geo = mesh.geometry;
  if (!geo.attributes.position) return mesh;
  geo.computeVertexNormals();
  const pos = geo.attributes.position;
  const base = new Float32Array(pos.array.length);
  base.set(pos.array);
  const normals = geo.attributes.normal
    ? new Float32Array(geo.attributes.normal.array)
    : null;
  const count = pos.count;
  const dents = new Float32Array(count);
  const center = new THREE.Vector3();
  const box = new THREE.Box3().setFromBufferAttribute(pos);
  box.getCenter(center);
  mesh.userData.deform = {
    base,
    normals,
    dents,
    center,
    dirty: false,
  };
  return mesh;
}

function markMany(meshes) {
  meshes.forEach(markDeformable);
  return meshes;
}

/* ========== Builders (higher subdivision for local dents) ========== */
function buildPeach() {
  const g = new THREE.Group();
  const bodyMat = mat(0xffb3c6, { roughness: 0.85 });
  const left = new THREE.Mesh(new THREE.SphereGeometry(0.72, 48, 48), bodyMat);
  left.position.x = -0.22;
  left.scale.set(0.95, 1.0, 0.92);
  const right = new THREE.Mesh(new THREE.SphereGeometry(0.7, 48, 48), bodyMat.clone());
  right.position.x = 0.28;
  right.scale.set(0.9, 0.95, 0.88);
  g.add(left, right);
  const crease = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.04, 0.9, 4, 8),
    mat(0xf48fb1, { roughness: 0.9 })
  );
  crease.position.set(0.02, 0.05, 0.55);
  crease.rotation.z = 0.08;
  g.add(crease);
  const leaf = new THREE.Mesh(
    new THREE.SphereGeometry(0.28, 16, 16),
    mat(0x7cb342, { roughness: 0.7 })
  );
  leaf.scale.set(1.4, 0.25, 0.7);
  leaf.position.set(-0.15, 0.85, 0);
  leaf.rotation.z = -0.4;
  g.add(leaf);
  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.04, 0.05, 0.25, 8),
    mat(0x6d4c41, { roughness: 0.8 })
  );
  stem.position.set(0.05, 0.95, 0);
  stem.rotation.z = 0.15;
  g.add(stem);
  g.userData.mainMeshes = markMany([left, right]);
  return g;
}

function buildBanana() {
  const g = new THREE.Group();
  const bananaMat = mat(0xffe066, { roughness: 0.65 });
  const curve = new THREE.Group();
  const segs = 8;

const screens = {
  start: document.getElementById('screen-start'),
  count: document.getElementById('screen-count'),
  pick: document.getElementById('screen-pick'),
};
const playUi = document.getElementById('play-ui');
const pickGrid = document.getElementById('pick-grid');
const canvasWrap = document.getElementById('canvas-wrap');
const playTitle = document.getElementById('play-title');
const playFeel = document.getElementById('play-feel');
const toastEl = document.getElementById('toast');

let offered = [];
let currentProduct = null;
let currentFeelKey = null;
let feelRevealed = false;
let toastTimer = 0;

function showScreen(name) {
  Object.keys(screens).forEach((k) => {
    screens[k].classList.toggle('hidden', k !== name);
  });
  if (name !== null) {
    playUi.classList.remove('active');
    canvasWrap.classList.remove('playing');
  }
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickFeel(product) {
  const pool = product.feelPool;
  return pool[Math.floor(Math.random() * pool.length)];
}

function offerProducts(count) {
  offered = shuffle(PRODUCTS).slice(0, count).map((p) => ({
    ...p,
    feelKey: pickFeel(p),
  }));
  pickGrid.className = 'pick-grid ' + (count >= 5 ? 'cols-3' : 'cols-2');
  pickGrid.innerHTML = '';
  offered.forEach((p, idx) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'card';
    btn.dataset.idx = String(idx);
    btn.innerHTML =
      '<span class="card-emoji">' + p.emoji + '</span>' +
      '<span class="card-name">' + p.name + '</span>' +
      '<span class="card-tag">' + p.tag + '</span>';
    pickGrid.appendChild(btn);
  });
}

function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

function revealFeel(fromDent) {
  if (feelRevealed || !currentFeelKey) return;
  feelRevealed = true;
  const f = FEELS[currentFeelKey];
  playFeel.textContent = f.label;
  playFeel.classList.add('revealed');
  if (fromDent && f.toast) showToast(f.toast);
}

  while (toyRoot.children.length) {
    const ch = toyRoot.children.pop();
    ch.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        if (Array.isArray(o.material)) o.material.forEach((m) => m.dispose());
        else o.material.dispose();
      }
    });
  }
  deformMeshes = [];
  toyModel = null;
  activeDentMesh = null;
  denting = false;
}

function collectDeformMeshes(model) {
  const mains = model.userData.mainMeshes || [];
  deformMeshes = mains.filter((m) => m && m.userData && m.userData.deform);
  if (!deformMeshes.length) {
    model.traverse((o) => {
      if (o.isMesh && o.userData.deform) deformMeshes.push(o);
    });
  }
}

function smoothFalloff(t) {
  // smootherstep: 1 at center, 0 at edge
  const x = Math.max(0, Math.min(1, 1 - t));
  return x * x * (3 - 2 * x);
}

function deepenDent(mesh, localPoint, amount, feel) {
  const d = mesh.userData.deform;
  if (!d) return;
  const { base, dents, normals, center } = d;
  const posAttr = mesh.geometry.attributes.position;
  const radius = feel.dentRadius;
  const maxDepth = feel.maxDepth;
  const invR = 1 / Math.max(radius, 1e-4);
  let changed = false;

  for (let i = 0; i < dents.length; i++) {
    const ix = i * 3;
    const bx = base[ix], by = base[ix + 1], bz = base[ix + 2];
    const dx = bx - localPoint.x;
    const dy = by - localPoint.y;
    const dz = bz - localPoint.z;
    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (dist >= radius) continue;
    const w = smoothFalloff(dist * invR);
    const add = amount * w / Math.max(feel.resistance, 0.5);
    if (add <= 0) continue;
    const next = Math.min(maxDepth, dents[i] + add);
    if (next > dents[i] + 1e-6) {
      dents[i] = next;
      changed = true;
    }
  }

  if (changed) {
    writeDentPositions(mesh, feel);
  }
}

function writeDentPositions(mesh, feel) {
  const d = mesh.userData.deform;
  if (!d) return;
  const { base, dents, normals, center } = d;
  const posAttr = mesh.geometry.attributes.position;
  const arr = posAttr.array;
  const wob = feel ? feel.wobble : 0;
  const wobAmp = wob * 0.015 * Math.sin(wobblePhase);

  for (let i = 0; i < dents.length; i++) {
    const ix = i * 3;
    const bx = base[ix], by = base[ix + 1], bz = base[ix + 2];
    let nx, ny, nz;
    if (normals) {
      nx = normals[ix];
      ny = normals[ix + 1];
      nz = normals[ix + 2];
    } else {
      nx = bx - center.x;
      ny = by - center.y;
      nz = bz - center.z;
      const len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
      nx /= len; ny /= len; nz /= len;
    }
    // also bias slightly toward geometric center for softer clay look
    _toward.set(center.x - bx, center.y - by, center.z - bz);
    if (_toward.lengthSq() > 1e-8) {
      _toward.normalize();
      nx = nx * 0.65 + _toward.x * 0.35;
      ny = ny * 0.65 + _toward.y * 0.35;
      nz = nz * 0.65 + _toward.z * 0.35;
      const len2 = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
      nx /= len2; ny /= len2; nz /= len2;
    }
    const depth = dents[i];
    const jiggle = depth > 0.01 ? wobAmp * depth : 0;
    arr[ix] = bx - nx * depth + jiggle * nx;
    arr[ix + 1] = by - ny * depth;
    arr[ix + 2] = bz - nz * depth - jiggle * 0.5 * nz;
  }
  posAttr.needsUpdate = true;
  mesh.geometry.computeVertexNormals();
  d.dirty = true;
}

function recoverDents(dt) {
  const feel = FEELS[currentFeelKey] || FEELS.jelly_fast;
  const rate = feel.recovery;
  for (let m = 0; m < deformMeshes.length; m++) {
    const mesh = deformMeshes[m];
    // while actively pressing this mesh, skip recovery on it
    if (denting && mesh === activeDentMesh) continue;
    const d = mesh.userData.deform;
    if (!d) continue;
    const { dents } = d;
    let any = false;
    if (rate <= 0) {
      // clay: stay forever until reset
      continue;
    }
    const decay = Math.exp(-rate * dt);
    // springy feels overshoot slightly via wobble phase already
    const springBoost = feel.wobble > 0.2 ? 1 + feel.wobble * 0.15 * Math.sin(wobblePhase * 1.7) : 1;
    const factor = Math.pow(decay, springBoost);
    for (let i = 0; i < dents.length; i++) {
      if (dents[i] <= 0) continue;
      dents[i] *= factor;
      if (dents[i] < 0.0008) dents[i] = 0;
      else any = true;
    }
    if (any || d.dirty) writeDentPositions(mesh, feel);
  }
}

function resetAllDents() {
  for (let m = 0; m < deformMeshes.length; m++) {
    const mesh = deformMeshes[m];
    const d = mesh.userData.deform;
    if (!d) continue;
    d.dents.fill(0);
    const posAttr = mesh.geometry.attributes.position;
    posAttr.array.set(d.base);
    posAttr.needsUpdate = true;
    mesh.geometry.computeVertexNormals();
    d.dirty = false;
  }
}

function setPointerFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
}

function raycastToy(e) {
  setPointerFromEvent(e);
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects(deformMeshes, false);
  return hits.length ? hits[0] : null;
}

function tick(now) {
  animId = requestAnimationFrame(tick);
  const t = now || performance.now();
  const dt = Math.min(0.05, (t - (lastFrameTime || t)) / 1000) || 0.016;
  lastFrameTime = t;

  const feel = FEELS[currentFeelKey] || FEELS.jelly_fast;
  wobblePhase += dt * (4 + feel.wobble * 6);

  if (denting && activeDentMesh && pointerMode === 'dent') {
    deepenDent(activeDentMesh, activeDentLocal, feel.pressRate * dt, feel);
  }

  recoverDents(dt);

  orbitYaw += (targetYaw - orbitYaw) * 0.12;
  orbitPitch += (targetPitch - orbitPitch) * 0.12;
  const dist = 4.0;
  camera.position.x = Math.sin(orbitYaw) * Math.cos(orbitPitch) * dist;
  camera.position.z = Math.cos(orbitYaw) * Math.cos(orbitPitch) * dist;
  camera.position.y = 0.55 + Math.sin(orbitPitch) * dist * 0.35;
  camera.lookAt(0, 0.05, 0);

  if (pedestal) pedestal.rotation.y = orbitYaw * 0.15;
  renderer.render(scene, camera);
}

function startPlay(product, feelKey) {
  try {
    if (!renderer) initThree();
    loadProduct(product, feelKey);
    showScreen(null);
    Object.keys(screens).forEach((k) => screens[k].classList.add('hidden'));
    playUi.classList.add('active');
    canvasWrap.classList.add('playing');
    onResize();
    lastFrameTime = 0;
    cancelAnimationFrame(animId);
    tick();
  } catch (err) {
    console.error('3D init failed', err);
    alert('进不去捏捏间，请刷新再试一下～');
    showScreen('pick');
  }
}

function stopPlayTo(screenName) {
  denting = false;
  pointerMode = null;
  pressPointerId = null;
  activeDentMesh = null;
  cancelAnimationFrame(animId);
  clearToy();
  canvasWrap.classList.remove('playing');
  playUi.classList.remove('active');
  toastEl.classList.remove('show');
  showScreen(screenName);
  if (renderer) renderer.render(scene, camera);
}

/* ========== Pointer: press=dent, drag=orbit ========== */
function onPointerDown(e) {
  if (!canvasWrap.classList.contains('playing')) return;
  e.preventDefault();
  downX = lastX = e.clientX;
  downY = lastY = e.clientY;
  pressPointerId = e.pointerId;
  pointerMode = null;
  denting = false;
  activeDentMesh = null;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}

  const hit = raycastToy(e);
  if (hit) {
    pointerMode = 'dent';
    denting = true;
    activeDentMesh = hit.object;
    activeDentLocal.copy(hit.point);
    activeDentMesh.worldToLocal(activeDentLocal);
    const feel = FEELS[currentFeelKey] || FEELS.jelly_fast;
    deepenDent(activeDentMesh, activeDentLocal, 0.04 * feel.pressRate, feel);
    revealFeel(true);
  } else {
    pointerMode = 'orbit';
  }
}

function onPointerMove(e) {
  if (!canvasWrap.classList.contains('playing')) return;
  if (pressPointerId !== e.pointerId) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  const totalDx = e.clientX - downX;
  const totalDy = e.clientY - downY;

  if (pointerMode === 'dent' && (Math.abs(totalDx) + Math.abs(totalDy) > ORBIT_THRESHOLD)) {
    // switch to orbit; existing dent stays
    pointerMode = 'orbit';
    denting = false;
  }

  if (pointerMode === 'orbit') {
    targetYaw -= dx * 0.01;
    targetPitch = Math.max(-0.5, Math.min(0.85, targetPitch + dy * 0.008));
  } else if (pointerMode === 'dent' && denting && activeDentMesh) {
    // optionally follow finger along surface
    const hit = raycastToy(e);
    if (hit && hit.object === activeDentMesh) {
      activeDentLocal.copy(hit.point);
      activeDentMesh.worldToLocal(activeDentLocal);
    }
  }

  lastX = e.clientX;
  lastY = e.clientY;
}

function onPointerUp(e) {
  if (pressPointerId !== null && e.pointerId !== pressPointerId) return;
  denting = false;
  pointerMode = null;
  pressPointerId = null;
  activeDentMesh = null;
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
}

canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
canvas.addEventListener('pointermove', onPointerMove, { passive: false });
canvas.addEventListener('pointerup', onPointerUp);
canvas.addEventListener('pointercancel', onPointerUp);
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

/* ========== Buttons ========== */
document.getElementById('btn-start').addEventListener('click', () => {
  showScreen('count');
});
document.getElementById('btn-back-start').addEventListener('click', () => {
  showScreen('start');
});
document.getElementById('btn-back-count').addEventListener('click', () => {
  showScreen('count');
});

document.getElementById('count-grid').addEventListener('click', (e) => {
  const btn = e.target.closest('.count-btn');
  if (!btn) return;
  const count = parseInt(btn.dataset.count, 10);
  if (!count) return;
  offerProducts(count);
  showScreen('pick');
});

function handlePick(e) {
  const card = e.target.closest('.card');
  if (!card || !pickGrid.contains(card)) return;
  e.preventDefault();
  e.stopPropagation();
  const idx = parseInt(card.dataset.idx, 10);
  if (Number.isNaN(idx) || !offered[idx]) return;
  const item = offered[idx];
  startPlay(item, item.feelKey);
}

let pickArmed = null;
pickGrid.addEventListener('pointerdown', (e) => {
  const card = e.target.closest('.card');
  pickArmed = card ? card.dataset.idx : null;
});
pickGrid.addEventListener('pointerup', (e) => {
  const card = e.target.closest('.card');
  if (card && pickArmed === card.dataset.idx) handlePick(e);
  pickArmed = null;
});
pickGrid.addEventListener('click', handlePick);

document.getElementById('btn-reset').addEventListener('click', () => {
  resetAllDents();
  denting = false;
  activeDentMesh = null;
  if (currentFeelKey && feelRevealed) {
    playFeel.textContent = FEELS[currentFeelKey].label;
    playFeel.classList.add('revealed');
  }
});

document.getElementById('btn-swap').addEventListener('click', () => {
  stopPlayTo('pick');
});

document.getElementById('btn-recount').addEventListener('click', () => {
  stopPlayTo('count');
});

document.getElementById('btn-exit').addEventListener('click', () => {
  stopPlayTo('start');
});

try {
  initThree();
  renderer.render(scene, camera);
} catch (err) {
  console.warn('WebGL warm-up skipped', err);
}
</script>
</body>
</html>
